<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Time - שריון מקום</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>SHOW TIME</h1>
    <p>הדרך החכמה למצוא איפה לראות את המשחק הבא</p>

    <nav>
        <a href="index.html">דף הבית</a>
        <a href="search.html">חיפוש אירועים</a>
        <a href="booking.html">שריון מקום</a>
    </nav>
</header>

<main>

    <div class="booking-section">
        <h2>שריון מקום מותאם אישית וסגירת פיקדון</h2>
        <p>מלאו את פרטי ההזמנה כדי להבטיח את מקומכם מול המסך בצפייה במשחק!</p>

        <form action="#" method="POST" id="bookingForm">
            
            <div class="form-group">
                <label for="match">בחר משחק צפייה:</label>
                <select id="match" name="match" required>
                    <option value="">-- בחר משחק מהרשימה --</option>
                    <option value="champions-league">גמר ליגת האלופות: ריאל מדריד נגד מנצ'סטר סיטי</option>
                    <option value="el-clasico">סופר קלאסיקו: ברצלונה נגד ריאל מדריד</option>
                    <option value="maccabi-haifa">ליגת העל: מכבי חיפה נגד מכבי תל אביב</option>
                </select>
            </div>

            <div class="form-group">
                <label for="venue">בחר בר/מסעדה:</label>
                <select id="venue" name="venue" required>
                    <option value="">-- בחר מיקום צפייה --</option>
                    <option value="bar-sali">בר הבראון - חיפה</option>
                    <option value="sports-pub">הפאב האירי - תל אביב</option>
                    <option value="match-point">מאץ' פוינט - ירושלים</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fullName">שם מלא:</label>
                <input type="text" id="fullName" name="fullName" placeholder="ישראל ישראלי" required>
            </div>

            <div class="form-group">
                <label for="phone">מספר טלפון:</label>
                <input type="tel" id="phone" name="phone" placeholder="050-1234567" required>
            </div>

            <div class="form-group">
                <label for="guests">מספר מקומות להזמנה:</label>
                <input type="number" id="guests" name="guests" min="1" max="20" value="2" required>
            </div>

            <div class="form-group">
                <label for="area">אזור ישיבה מועדף:</label>
                <select id="area" name="area" required>
                    <option value="main-screen">צמוד למסך הענק המרכזי</option>
                    <option value="bar">ישיבה על הבר</option>
                    <option value="smoking">אזור מעשנים (עם מסכים היקפיים)</option>
                    <option value="outer">חצר חיצונית</option>
                </select>
            </div>

            <div class="form-group">
                <label for="cardNumber">מספר כרטיס אשראי:</label>
                <input type="text" id="cardNumber" name="cardNumber" placeholder="16 ספרות ללא מקפים" maxlength="16" required>
            </div>

            <div class="form-row-credit">
                <div class="form-group-credit">
                    <label for="expDate">תוקף (MM/YY):</label>
                    <input type="text" id="expDate" name="expDate" placeholder="05/29" maxlength="5" required>
                </div>
                <div class="form-group-credit">
                    <label for="cvv">קוד ביטחון (CVV):</label>
                    <input type="text" id="cvv" name="cvv" placeholder="3 ספרות בגב הכרטיס" maxlength="3" required>
                </div>
            </div>

            <button type="submit">אשר הזמנה ותפוס מקום</button>
        </form>
    </div>

</main>

<footer>
    <p>כל הזכויות שמורות לת.ז 211610894, ת.ז 322822727, ת.ז 212744148 </p>
</footer>



</body>
</html>
